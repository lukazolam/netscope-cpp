
name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build NetScope
        run: cmake --build build --config Release

      - name: Run export regression test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Windows startup smoke test
        shell: pwsh
        run: |
          "0" | & ".\build\Release\netscope.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "NetScope exited with code $LASTEXITCODE"
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-x64
          path: build/Release/netscope.exe
          if-no-files-found: error
